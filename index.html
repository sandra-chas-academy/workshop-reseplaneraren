<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Stadstrafiken</title>
</head>
<body>

    <div class="app">

        <div class="topp">
            <div class="logo"></div>
            <div class="titel">Stadstrafiken</div>
            <div class="profil"></div>
        </div>

        <div class="flikar">
            <div class="flik aktiv">Reseplanerare</div>
            <div class="flik">Avgångar</div>
            <div class="flik">Trafikläget</div>
        </div>

        <div class="sokkort">
            <div class="falt">
                <input type="text" class="input" placeholder="Från">
            </div>

            <div class="vaxla">⇅</div>

            <div class="falt">
                <input type="text" class="input" placeholder="Till">
            </div>

            <div class="falt-rad">
                <input type="text" class="input" placeholder="Datum">
                <input type="text" class="input" placeholder="Tid">
            </div>

            <div class="fel"></div>

            <div class="knapp">Sök resa</div>
        </div>

        <div class="avgangar">
            <div class="avgangar-rubrik">Nästa avgångar från Slussen</div>

            <div class="avgang">
                <div class="linje buss">4</div>
                <div class="mal">Radiohuset</div>
                <div class="tid">2 min</div>
                <div class="prick rod"></div>
            </div>

            <div class="avgang">
                <div class="linje tunnelbana">13</div>
                <div class="mal">Ropsten</div>
                <div class="tid">4 min</div>
            </div>

            <div class="avgang">
                <div class="linje pendel">41</div>
                <div class="mal">Södertälje centrum</div>
                <div class="tid">7 min</div>
                <div class="prick gul"></div>
            </div>

            <div class="avgang">
                <div class="linje buss">76</div>
                <div class="mal">Ropsten</div>
                <div class="tid">11 min</div>
            </div>
        </div>

        <div class="fot">
            <div class="fot-lank">Köp biljett</div>
            <div class="fot-lank">Mina resor</div>
            <div class="fot-lank">Hjälp</div>
        </div>

    </div>

</body>
</html>
