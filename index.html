<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Stadstrafiken</title>
</head>
<body>

    <div class="topbar">
        <div class="topbar-sok">
            <svg class="ikon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                <circle cx="11" cy="11" r="6.5"/>
                <line x1="15.8" y1="15.8" x2="21" y2="21"/>
            </svg>
            <span>Sök</span>
        </div>
        <img src="img/logo.svg" class="logo">
        <div class="topbar-meny">
            <span>Meny</span>
            <svg class="ikon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                <line x1="3" y1="6" x2="21" y2="6"/>
                <line x1="3" y1="12" x2="21" y2="12"/>
                <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
        </div>
    </div>

    <div class="hero">
        <img src="img/tunnelbana-stockholm-1-1.jpg" class="hero-bild">
        <div class="flikar">
            <div class="flik aktiv">Sök resa</div>
            <div class="flik">Sök avgångar</div>
        </div>
    </div>

    <div class="sokpanel">
        <div class="sokrubrik">Vart vill du åka?</div>

        <div class="falt">
            <div class="etikett">Från</div>
            <input type="text" class="input">
        </div>

        <div class="vaxla">⇅</div>

        <div class="falt">
            <div class="etikett">Till</div>
            <input type="text" class="input">
        </div>

        <div class="falt-rad">
            <div class="falt">
                <div class="etikett">Datum</div>
                <input type="text" class="input">
            </div>
            <div class="falt">
                <div class="etikett">Tid</div>
                <input type="text" class="input">
            </div>
        </div>

        <div class="fel"></div>

        <div class="knapp">Sök resa</div>
    </div>

    <div class="genvagar">
        <div class="genvag">Reseplanering<span class="pil">→</span></div>
        <div class="genvag">Biljetter<span class="pil">→</span></div>
        <div class="genvag">Kundservice<span class="pil">→</span></div>
        <div class="genvag">Aktuellt<span class="pil">→</span></div>
    </div>

    <div class="trafik">
        <div class="trafikrubrik">Trafikläget just nu</div>
        <div class="uppdaterad">Uppdaterad idag 13:26</div>

        <div class="linjekort">
            <span class="linjeikon tunnelbana"></span>
            <span class="linjenamn">Blå linjen</span>
            <span class="status ok"></span>
        </div>
        <div class="linjekort">
            <span class="linjeikon tunnelbana"></span>
            <span class="linjenamn">Röda linjen</span>
            <span class="status ok"></span>
        </div>
        <div class="linjekort">
            <span class="linjeikon tunnelbana"></span>
            <span class="linjenamn">Gröna linjen</span>
            <span class="status ok"></span>
        </div>
        <div class="linjekort">
            <span class="linjeikon pendel"></span>
            <span class="linjenamn">Pendeltåg</span>
            <span class="status varning"></span>
        </div>
        <div class="linjekort">
            <span class="linjeikon sparvagn"></span>
            <span class="linjenamn">Spårvagn och lokalbana</span>
            <span class="status info"></span>
        </div>
        <div class="linjekort">
            <span class="linjeikon buss"></span>
            <span class="linjenamn">Buss</span>
            <span class="status info"></span>
        </div>
    </div>

    <div class="fot">
        <div class="fot-lank">Om Stadstrafiken</div>
        <div class="fot-lank">Kontakta oss</div>
        <div class="fot-lank">Tillgänglighet</div>
    </div>

</body>
</html>
